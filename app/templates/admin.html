{% extends "base.html" %}

{% block content %}
<section class="section admin-layout">
    <div class="panel">
        <h1>Admin Dashboard</h1>
        <p>Add, edit, or delete concerts.</p>
        <form id="concertForm">
            <input type="hidden" id="adminConcertId">
            <label>Title
                <input id="title" type="text" required>
            </label>
            <label>Artist
                <input id="artist" type="text" required>
            </label>
            <label>Venue
                <input id="venue" type="text" required>
            </label>
            <label>Date
                <input id="concertDate" type="date" required>
            </label>
            <label>Price
                <input id="price" type="number" step="0.01" min="0" required>
            </label>
            <label>Seats Available
                <input id="seatsAvailable" type="number" min="0" required>
            </label>
            <label>Description
                <textarea id="description" rows="4" required></textarea>
            </label>
            <label>Image URL
                <input id="imageUrl" type="url" placeholder="https://example.com/concert.jpg" required>
            </label>
            <div class="actions">
                <button type="submit">Save Concert</button>
                <button type="button" class="secondary" id="clearForm">Clear</button>
            </div>
        </form>
        <p id="adminMessage" class="message"></p>
    </div>

    <div>
        <h2>Current Concerts</h2>
        <div id="adminConcertList" class="list"></div>
    </div>
</section>
{% endblock %}
